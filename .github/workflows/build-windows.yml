name: Build GDC Vault (Windows)

# Se ruleaza automat la orice push pe main, si manual din tab-ul Actions.
# Scop principal (2026-08-24): `dotnet build` de pe Mac NU compileaza
# XAML->BAML (PresentationBuildTasks e Windows-only) — asta e SINGURA
# verificare reala ca legaturile XAML (Image.Source, Converter etc.)
# chiar functioneaza, exact lectia invatata la GDCPluginManagerWin
# (bug-ul "coperile nu se afisau" nu a fost prins de build local pe Mac).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    # [CLAUDE.md Regula 34, 2026-09-06] `secrets` NU e un context permis
    # direct intr-un `if:` de pas (confirmat cu actionlint - "context
    # 'secrets' is not allowed here"). Fix: valoarea trece printr-un
    # `env:` la nivel de JOB (aici `secrets` E permis), iar pasii citesc
    # `env.HAS_WIN_SELFSIGN` (context permis in `if:`). Vezi tiparul
    # identic din CGConvertor.
    env:
      HAS_WIN_SELFSIGN: ${{ secrets.WIN_SELFSIGN_PFX_BASE64 != '' }}
    steps:
      - name: Descarca codul din repo
        uses: actions/checkout@v4

      - name: Instaleaza .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compileaza GDCVault.Core
        run: dotnet build src/GDCVault.Core/GDCVault.Core.csproj -c Release

      - name: Compileaza GDCVault.Client (verifica XAML/BAML real)
        run: dotnet build src/GDCVault.Client/GDCVault.Client.csproj -c Release

      - name: Publica exe-ul (self-contained, win-x64)
        run: dotnet publish src/GDCVault.Client/GDCVault.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

      # [CLAUDE.md Regula 34, 2026-09-06] Semnare Self-Signed, DOAR pentru
      # testare interna/cerc restrans (NU elimina SmartScreen pentru
      # publicul larg - vezi codesigning/README-windows.md). Ruleaza DOAR
      # daca secretele exista (Cristi le incarca o singura data, direct de
      # pe Windows real - certificatul nu trece niciodata prin conversatia
      # cu Claude) - altfel build-ul continua NESEMNAT, exact ca inainte,
      # fara nicio eroare. Secretele sunt COMUNE tuturor aplicatiilor GDC.
      - name: Semneaza GDCVault.exe (Self-Signed, test intern)
        if: ${{ env.HAS_WIN_SELFSIGN == 'true' }}
        shell: pwsh
        env:
          WIN_SELFSIGN_PFX_BASE64: ${{ secrets.WIN_SELFSIGN_PFX_BASE64 }}
          WIN_SELFSIGN_PFX_PASSWORD: ${{ secrets.WIN_SELFSIGN_PFX_PASSWORD }}
        run: .\codesigning\sign-windows.ps1 -TargetPath "publish\GDCVault.exe"

      - name: Compileaza instalatorul (Inno Setup - preinstalat pe runner-ul windows-latest)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Semneaza installer-ul final (Self-Signed, test intern)
        if: ${{ env.HAS_WIN_SELFSIGN == 'true' }}
        shell: pwsh
        env:
          WIN_SELFSIGN_PFX_BASE64: ${{ secrets.WIN_SELFSIGN_PFX_BASE64 }}
          WIN_SELFSIGN_PFX_PASSWORD: ${{ secrets.WIN_SELFSIGN_PFX_PASSWORD }}
        run: .\codesigning\sign-windows.ps1 -TargetPath "Output\GDCVaultSetup.exe"

      - name: Incarca instalatorul ca artefact descarcabil
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: GDCVault-Windows-Installer
          path: Output/GDCVaultSetup.exe
